services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://chat3d:${POSTGRES_PASSWORD:-chat3d}@db:5432/chat3d
    ports:
      - "8000:8000"
    volumes:
      - files:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat3d
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat3d}
      POSTGRES_DB: chat3d
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat3d"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  files:
